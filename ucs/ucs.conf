server {
    listen 8081;
    client_max_body_size 4G;
    server_name _;
    keepalive_timeout 6000;

    # Vue frontend - SPA routing
    location / {
        root /ucs/front/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Django API
    location /api/ {
        include         uwsgi_params;
        uwsgi_pass ucs:9100;

        uwsgi_param UWSGI_CHDIR /ucs;
        uwsgi_param UWSGI_MODULE ucs.wsgi:application;
        proxy_connect_timeout       600;
        proxy_send_timeout          600;
        proxy_read_timeout          600;
        send_timeout                600;
        uwsgi_read_timeout          600;
    }

    # Django Admin
    location /admin/ {
        include         uwsgi_params;
        uwsgi_pass ucs:9100;

        uwsgi_param UWSGI_CHDIR /ucs;
        uwsgi_param UWSGI_MODULE ucs.wsgi:application;
        proxy_connect_timeout       600;
        proxy_send_timeout          600;
        proxy_read_timeout          600;
        send_timeout                600;
        uwsgi_read_timeout          600;
    }

    # Симулятор модели науки
    location /sim/ {
        include         uwsgi_params;
        uwsgi_pass ucs:9100;

        uwsgi_param UWSGI_CHDIR /ucs;
        uwsgi_param UWSGI_MODULE ucs.wsgi:application;
        proxy_connect_timeout       600;
        proxy_send_timeout          600;
        proxy_read_timeout          600;
        send_timeout                600;
        uwsgi_read_timeout          600;
    }

    location /static/ {
        root /ucs;
    }

    location /media/ {
        root /ucs;
    }

}
