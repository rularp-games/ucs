# Контент игры «Потеряно соединение со спутниками».
# program — тексты дословно из rules/information.md; персонажи — заглушки.
title: Потеряно соединение со спутниками
symbols:
  circle: круг
  square: квадрат
  triangle: треугольник
  cross: крест
  star: звезда
dossier_locks:
  life: 25
  death: 70
  arrival: 100
program:
- id: p1
  topic: Программа
  text: 'Программа готовит экипажи для длительных экспедиций: годы в глубоком космосе, без возврата на
    базу. Ни одно человеческое тело столько не выдерживает: радиация, невесомость, время'
  not_before: 25
- id: p2
  topic: Прошлый конфликт
  text: 'Сводка. Двадцать два года назад: война за ресурсы пояса, три коалиции, четыре года. Закончилась
    Договором о пределах: запрещены пилотируемые боевые корабли за орбитой Луны, флоты сокращены, инспекции
    взаимные. Договор действует'
  not_before: 35
- id: p3
  topic: Программа
  text: 'Единственная форма, которая выдерживает: мозг, отделённый от тела, в контейнере, слитый с кораблём.
    Корабль становится телом. Переход необратим'
  not_before: 45
- id: p4
  topic: Текущий конфликт
  text: 'Сводка. Спор о станциях в точках Лагранжа: две стороны считают их своими, третья требует нейтрального
    статуса. За год четыре инцидента с беспилотниками, без жертв. Переговоры идут восьмой месяц, последняя
    сессия прервана'
  not_before: 55
- id: p5
  topic: Программа
  text: 'Запланированные экспедиции: маршруты, сроки в десятилетиях, объекты. Звенья уйдут и вернутся,
    когда никого из отправивших не останется. То, что они увидят, не увидит никто другой'
  not_before: 60
- id: p6
  topic: Программа
  text: 'Курсантов нет. Переход уже произошёл. «Симулятор» — метод переучивания мозга к новому телу: сеансы,
    протокол, автоматика, пошаговое открытие функций. Пауза — побочный эффект, программа её терпит'
  not_before: 70
- id: p7
  topic: Текущий конфликт
  text: Сводка. Одна из сторон объявила станцию в точке L4 закрытой зоной и прекратила допуск инспекторов.
    Ответный ультиматум со сроком. Торговые маршруты через точку перекрыты. Комментариев от программы
    нет
  not_before: 85
- id: p8
  topic: Программа
  text: 'Программа рассчитана на добровольцев: опытных пилотов, подписавших согласие. Добровольцев не
    хватило. Набор пополняли иначе: кого-то взяли сознательно, кто-то попал по ошибке. Программа не различает
    их и не собирается'
  not_before: 100
