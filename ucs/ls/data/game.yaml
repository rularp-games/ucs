  text: 'Городской морг. Ведомость по договору с отделом комплектования.


    И. {Семь-Три:Смолин|Смолина}, 34 года, и И. {Два-Семь:Сафин|Сафина}, 45 лет. Обрушение эстакады на
    Заводской. Срок востребования 72 часа истёк. Передача программе оформлена по решению учреждения.


    Индивидуальных согласий нет. Имена установлены; подмены личности в этих двух делах не обнаружено.
    Причина, по которой близкие не обратились в срок, ведомостью не установлена.


    Заключение: «Договор действует. Дополнительное разрешение не запрашивать».'
