  queue: null
  text: 'Лаборатория Н. Сабуровой. Продолжение дела 0417.


    Л. Мороз: начало участия в 47 лет, смерть в 58 лет, остановка сердца во сне. Первоначальное согласие
    разрешает упражнения, регистрацию результатов и дальнейшее использование исследовательских данных.
    Согласия на перенос мозга и необратимый переход нет.


    После смерти форма приложена к акту передачи как основание продолжения исследования. В замечании регистратора:
    «Данные исследования и сам участник — не один объект согласия».


    Решение: «Оформление не пересматривать. Считать продолжением протокола».'
