archive:
- code: '6060'
  title: Основание
  kind: История
  not_before: 25
  queue: 1
  text: 'Справка. Институт дальних экспедиций. Лаборатория нейроинтерфейсов основана пятнадцать лет назад.
    Руководитель — В. Остроумова.


    Задача лаборатории: подготовка экипажей для маршрутов, на которых человек в привычной форме не выживает.
    Девиз: «Увидеть то, чего не видел никто».


    Связь с кораблями обеспечивает сеть ретрансляторов (см. 7203).'
- code: '3108'
  title: Транспорт «Кедр»
  kind: История
  not_before: 35
  queue: 2
  text: 'Из сводки потерь войны за пояс. Транспорт «Кедр», бортовой 3108. Атакован беспилотным перехватчиком
    у края пояса. Пожар в машинном отсеке.


    Командир транспорта Р. {Три-Три:Ахмеров|Ахмерова}. Бортмеханик С. Ковальчук {Ноль-Семь:вывел|вывела}
    из горящего отсека четверых, {Ноль-Семь:получил|получила} ожоги. Экипаж спасён полностью, транспорт
    потерян.


    Ковальчук к награде {Ноль-Семь:представлен не был|представлена не была}: документы сгорели вместе
    с отсеком. Через год подписан Договор о пределах.


    Позднее личное дело бортмеханика: 3109.'
- code: '7203'
  title: Сеть «Ожерелье»
  kind: История
  not_before: 45
  queue: 3
  text: 'Техническая справка. Сеть «Ожерелье»: тридцать шесть ретрансляторов, главный инженер Л. Гордеев.


    Покрытие неполное. При прохождении корабля за плотными объектами возникают окна без связи длительностью
    до шести минут. Работа корабля в окне не регламентирована.


    Монтаж участка 7200–7210: П. {Восемь-Три:Ланской|Ланская}.


    Примечание инженера: «Окна не устранять. Обоснование в журнале, 7204».


    Связанный документ кадровой службы: 7205.'
- code: '0417'
  title: Исследование памяти
  kind: История
  not_before: 45
  queue: null
  text: 'Лаборатория Н. Сабуровой. Исследование сохранности памяти у взрослых добровольцев.


    {Один-Четыре:Участник|Участница} № 0417: Л. Мороз, 47 лет на момент включения, библиотекарь. Жалоба:
    страх забыть.


    Методика: пошаговое восстановление навыка через повторение, без объяснения участнику цели упражнения.
    Навык, освоенный полностью, участник выполняет без внимания.


    {Один-Четыре:Участник подписал|Участница подписала} согласие на дальнейшее использование данных исследования.
    Срок согласия не указан.


    Позднее продолжение дела участника: 0418.'
- code: '2207'
  title: Они видят
  kind: Диалог
  not_before: 55
  queue: 4
  text: 'Расшифровка разговора. В. Остроумова, Н. Сабурова.


    — Ты читала отчёт {Один-Один:Вяземского|Вяземской}?

    — Читала. Это не может быть правдой.

    — Обсерватория подтвердила через сорок одну минуту.

    — Значит, совпадение.

    — {Один-Один:Он сказал|Она сказала}: «Солнце вздохнуло». Нина, ни один человек этого не чувствовал.
    Ни один прибор.

    — Мы не знаем, что именно {Один-Один:он|она} чувствует.

    — Не знаем. Поэтому мы здесь. Это новый способ знать.

    — Или новый способ ошибаться. Кому ты это покажешь?

    — Всем. Это не наше.


    Приложения: 4102, 4511.'
- code: '1407'
  title: Эстакада на Заводской
  kind: История
  not_before: 65
  queue: null
  text: 'Сводка происшествий. Обрушение эстакады на Заводской улице, 7:48.


    Трамвай маршрута 14, борт 07, упал вместе с пролётом. Диспетчерский пункт под пролётом разрушен. Диспетчер
    И. {Два-Семь:Сафин оставался|Сафина оставалась} на связи с вагоном до обрушения.


    Погибших двадцать три. Опознаны двадцать один. Невостребованных тел два.


    Связанная ведомость передачи: 1408.'
- code: '1455'
  title: Частота 145,50
  kind: История
  not_before: 65
  queue: null
  text: 'Аппаратный журнал любительской станции. Владелец Л. Гордеев.


    Связи на частоте 145,50, по воскресеньям, 21:00. Корреспондент — {Девять-Один:Савва|Соня}.


    Последние записи: «Приём, {Девять-Один:Савва|Соня}. Приём. Приём».


    Ниже, другим почерком: «{Девять-Один:Он|Она} в списке. Я не знал. 1456».'
- code: '4102'
  title: Вспышка
  kind: Серия А
  not_before: 60
  queue: 5
  text: 'Протокол сеанса. Борт 1-1, Серия А.


    Пилот: «Давление слева. Как будто корпус прижали ладонью. Солнце… вздохнуло. Сейчас будет».


    Время сообщения: 14:02. Регистрация вспышки обсерваторией: 14:43.


    На запрос, как пилот это определил: «Не знаю. Корпус чувствует. Я теперь корпус».


    Позднее обращение того же борта: 4200.'
- code: '4511'
  title: Юпитер
  kind: Серия А
  not_before: 60
  queue: null
  text: 'Бортжурнал 9-9, Серия А, запись первая.


    «Сегодня я слышал Юпитер. Не радио, не приборы. Он гудит, как трансформатор, если прижаться к нему
    щекой. Только щеки нет, есть корпус.


    Поле у него не круглое. Там узел, на два часа от полюса. Отметьте. Если зонд найдёт, значит, я не
    {Девять-Девять:сошёл|сошла} с ума».


    Приписка лаборатории, через девять месяцев: «Зонд подтвердил узел».


    Реестр участников этой серии: 3300.'
- code: '9001'
  title: Окно
  kind: Диалог
  not_before: 65
  queue: 6
  text: 'Расшифровка разговора. Н. Сабурова, Л. Гордеев.


    — В отчёте окна по шесть минут. Это можно закрыть?

    — Можно. Четыре ретранслятора.

    — Бюджет есть.

    — Есть.

    — Лев.

    — Ты видела, что они делают в окне?

    — Разговаривают. Активность речевых зон.

    — Они разговаривают, Нина. Друг с другом. Без протокола.

    — Это мешает методу.

    — Это единственное, что у них осталось от людей. Запиши, что метод это терпит.

    — …Запишу: «пауза, которую метод терпит».

    — Обоснование будет в журнале. 7204.'
- code: '3300'
  title: Тишина
  kind: Серия А
  not_before: 75
  queue: null
  text: 'Список Серии А. Девять позывных.


    В строю: 1-1, 3-3, 9-9.

    Не пережили переход: трое.

    Тишина: Ганиев, Ласточкина.

    Отключён: Корнилов. Основание: отказ от учебных стрельб. В отчёте для заказчика — тишина.


    Последний сеанс Ганиева, после прохода через пояс: «Здесь ничего не надо делать. Не зовите меня».'
- code: '1919'
  title: Заключение 19-К
  kind: История
  not_before: 70
  queue: 7
  text: 'Юридическое заключение. Автор Ю. Мейер.


    Вопрос: распространяется ли Договор о пределах на корабли программы.


    Ответ. Договор запрещает пилотируемые боевые корабли за орбитой Луны. Экипаж — это человек на борту.
    Мозг, отделённый от тела, человеком в смысле Договора не является и экипажем не считается. Корабли
    программы являются беспилотными. Ограничений на установку боевых модулей нет.


    Особое мнение: отсутствует.'
- code: '8500'
  title: Деньги
  kind: Диалог
  not_before: 70
  queue: 8
  text: 'Расшифровка разговора. М. Тальберг, В. Остроумова.


    — Комиссия готова финансировать программу полностью. Вас закрывают в декабре, вы знаете.

    — Знаю.

    — Условие одно. Боевой модуль в каждом корпусе.

    — Это исследовательские машины.

    — Конечно. Экспедиции — после. Мы никого не заставляем воевать, Вера. Мы сдерживаем. Корабль, который
    слышит пуск за сорок минут, — лучший аргумент на любых переговорах.

    — Вы читали отчёт {Один-Один:Вяземского|Вяземской}.

    — Мы читали все отчёты. Юристы считают, что Договор вам не мешает. Заключение приложено, 1919.

    — А если они откажутся стрелять?

    — Они — это кто?

    — Пилоты.

    — Вера. Пилотов там нет. Вы сами это доказали.'
- code: '4200'
  title: Прицел
  kind: Диалог
  not_before: 75
  queue: null
  text: 'Расшифровка сеанса через терминал. Борт 1-1. В. Остроумова, Т. {Один-Один:Вяземский|Вяземская}.


    — {Один-Один:Тимофей|Тамара}, ты меня слышишь?

    — Слышу. Ты пришла сказать про Корнилова.

    — Его не отключали. Он в тишине.

    — Вера, я слышу, как дышит Солнце. Думаешь, я не слышу, как ты врёшь?

    — Программу закрывали.

    — Я {Один-Один:шёл|шла} сюда, чтобы мы узнали то, чего никто не знает. Ты отдала это тем, кому нужно
    знать, где чужой корабль.

    — Экспедиции будут. После.

    — После чего?

    — …

    — Не дай им сделать из нас прицел.

    — Я постараюсь.

    — Ты уже не стараешься. Ты подписала.


    Список Серии А: 3300.'
- code: '0312'
  title: Тихая гавань
  kind: Дело
  not_before: 80
  queue: null
  text: 'Хоспис «Тихая гавань». Журнал тестовой программы, продолжение после смерти участников.


    Палата 312: Г. Штольц, 70 лет. Подпись под тестом сохранности речи: запись голоса, упражнения, право
    прекратить сеанс. Родственников нет. После смерти {Шесть-Пять:передан|передана} программе как участник
    продолженного исследования.


    М. Лесных, 27 лет, {Два-Два:медбрат, умер|медсестра, умерла} на смене. Участие в тесте нейроинтерфейса
    сотрудник–пациент, та же форма № 4. Разрешены датчики и прерываемый сеанс. После смерти согласие использовано
    для перехода.


    Примечание юриста хосписа: форма № 4 не разрешает изъятия мозга, необратимого перехода и отказа в
    прекращении участия. Ответ отдела комплектования: «Продолжение теста оформлено. Не пересматривать».


    В поле стоимости оба человека значатся оборудованием длительного наблюдения.'
- code: '5521'
  title: Расхождение бирок
  kind: Дело
  not_before: 80
  queue: null
  text: 'Акт о расхождении. Морг № 3.


    Тело, опознанное по бейджу курьера № 5521 (А. {Восемь-Восемь:Чернов|Чернова}, 23 года, ДТП), и тело
    с биркой 5512 ({Восемь-Восемь:мужчина|женщина}, 24 года, ДТП, согласие родителей на передачу подписано)
    перепутаны при выдаче. Тело {Восемь-Восемь:Чернова|Черновой} передано программе. Расхождение обнаружено
    через сутки.


    Решение отдела комплектования: «Исправление невозможно. Программа не различает».


    Тело по бирке 5512 похоронено семьёй.'
- code: '2263'
  title: Однофамилец
  kind: Дело
  not_before: 80
  queue: null
  text: 'Отдел комплектования, Серия Б.


    {Четыре-Ноль:Кандидат Е. Брагин|Кандидатка Е. Брагина}, пилот, доброволец. Отказ за сутки до операции.
    Место в графике зарезервировано.


    В тот же день в базу {Четыре-Ноль:поступил Е. Брагин|поступила Е. Брагина}, 62 года, метеостанция
    № 2263, смерть естественная, родственников нет. Совпадение фамилии и инициала. Графу «согласие» система
    заполнила по совпадению.


    Решение: «Оставить. График не сдвигать».'
- code: '7712'
  title: Партия с полигона
  kind: Диалог
  not_before: 80
  queue: null
  text: 'Расшифровка разговора. А. Кольцов, М. Тальберг.


    — По части 7712: две единицы с учений.

    — Основание?

    — Полевой врач. Обычную реанимацию признал безрезультатной, выбрал протокол сохранения мозга. Сказал:
    иначе никто не выживет.

    — Самих спрашивали?

    — Без сознания. До семей не дозвонились.

    — И как теперь оформлять?

    — Как передачу ведомством. Врач просит сообщить семьям, что их спасли.

    — Семьям уже выдано заключение о гибели.

    — Тогда врач хочет знать хотя бы позывные.

    — Не положено.'
- code: 0904
  title: Диктофон
  kind: Диалог
  not_before: 80
  queue: null
  text: 'Личная запись В. Остроумовой. Не для протокола.


    «{Пять-Один:Костя|Ксюша}. Мне позвонили в четыре утра. Я приехала, когда уже потушили. Мозг был цел.
    Я смотрела на результаты и думала как врач: сохранность хорошая. Потом думала как мать.


    Я не могла отдать тебя земле. Я вписала тебя сама. Кольцов спросил, на каком основании. Я сказала:
    ошибка списка. Он написал: случайность.


    Ты {Пять-Один:рисовал|рисовала} космос для детей, помнишь? Теперь ты его увидишь.


    Прости меня. Или не прощай. Только живи».'
- code: '1456'
  title: Мой сын
  kind: Диалог
  not_before: 80
  queue: 9
  text: 'Расшифровка разговора. Л. Гордеев, А. Кольцов.


    — Почему {Девять-Один:мой сын|моя дочь} в списке?

    — Врач применил протокол сохранения. После обычной реанимации шансов не было.

    — Я был в больнице через шесть часов.

    — Решение приняли в первые два. Он хотел спасти.

    — Почему не дождался меня?

    — Мозг не ждал бы.

    — {Девять-Один:Он мой сын|Она моя дочь}.

    — Лев Аркадьевич, если вам будет легче: сохранность очень хорошая.

    — А если {Девять-Один:он сам|она сама} не захочет такой жизни?

    — Это уже к вашей программе.

    — …

    — В каком {Девять-Один:он|она} звене?

    — Не положено.'
- code: '7204'
  title: Журнал инженера
  kind: История
  not_before: 80
  queue: 10
  text: 'Журнал главного инженера сети «Ожерелье».


    «Окна можно было закрыть. Я не закрыл. Шесть минут без спутника — единственное время, когда их никто
    не учит стрелять. Пусть хотя бы там они будут людьми.


    Если кто-то из них это читает: я не знаю, где {Девять-Один:мой сын|моя дочь}. Позывные мне не говорят.
    {Девять-Один:Савва|Соня}, если ты слышишь: 145,50, воскресенье, девять вечера. Я всё ещё выхожу в
    эфир».'
- code: '7205'
  title: Страховая форма
  kind: Дело
  not_before: 80
  queue: null
  text: 'Кадровая служба монтажного участка 7200–7210.


    П. {Восемь-Три:Ланской|Ланская}. Подписано: страховое возмещение семье при гибели на работе. В реестре
    документ загружен в графу «согласие на переход» по совпавшему номеру формы.


    Расхождение найдено после переноса. Ответ отдела комплектования: «Обратное исполнение невозможно.
    Оставить действующий допуск».


    Личного разрешения на изъятие мозга и перенос в форме нет.'
