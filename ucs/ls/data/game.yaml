# Контент игры «Потеряно соединение со спутниками».
# program — тексты дословно из rules/information.md; архив — дословно из lore/archive.md;
# звено 1 — дословно из characters/flight-1/*.md; звенья 2 и 3 — заглушки.
title: Потеряно соединение со спутниками
symbols:
  circle: круг
  square: квадрат
  triangle: треугольник
  cross: крест
  star: звезда
dossier_locks:
  life: 25
  death: 65
  arrival: 80
program:
- id: p1
  topic: Программа
  text: 'Программа готовит экипажи для длительных экспедиций: годы в глубоком космосе, без возврата на
    базу. Ни одно человеческое тело столько не выдерживает: радиация, невесомость, время'
  not_before: 25
  free: true
- id: p2
  topic: Прошлый конфликт
  text: 'Сводка. Двадцать два года назад: война за ресурсы пояса, три коалиции, четыре года. Закончилась
    Договором о пределах: запрещены пилотируемые боевые корабли за орбитой Луны, флоты сокращены, инспекции
    взаимные. Договор действует'
  not_before: 35
  free: true
- id: p3
  topic: Программа
  text: 'Единственная форма, которая выдерживает: мозг, отделённый от тела, в контейнере, слитый с кораблём.
    Корабль становится телом. Переход необратим'
  not_before: 45
  free: false
- id: p4
  topic: Текущий конфликт
  text: 'Сводка. Спор о станциях в точках Лагранжа: две стороны считают их своими, третья требует нейтрального
    статуса. За год четыре инцидента с беспилотниками, без жертв. Переговоры идут восьмой месяц, последняя
    сессия прервана'
  not_before: 55
  free: true
- id: p5
  topic: Программа
  text: 'Запланированные экспедиции: маршруты, сроки в десятилетиях, объекты. Звенья уйдут и вернутся,
    когда никого из отправивших не останется. То, что они увидят, не увидит никто другой'
  not_before: 60
  free: false
- id: p6
  topic: Программа
  text: 'Курсантов нет. Переход уже произошёл. «Симулятор» — метод переучивания мозга к новому телу: сеансы,
    протокол, автоматика, пошаговое открытие функций. Пауза — побочный эффект, программа её терпит'
  not_before: 60
  free: false
- id: p7
  topic: Текущий конфликт
  text: Сводка. Одна из сторон объявила станцию в точке L4 закрытой зоной и прекратила допуск инспекторов.
    Ответный ультиматум со сроком. Торговые маршруты через точку перекрыты. Комментариев от программы
    нет
  not_before: 85
  free: true
- id: p8
  topic: Программа
  text: 'В программе смешаны пять оснований: личный добровольный переход, решение другого спасти человека,
    ограниченное согласие на тест, передача учреждением без согласия и ошибка в документах. Для системы
    все они — допуск к переучиванию. Их различие важно людям, не программе'
  not_before: 80
  free: false
program_questions:
- id: q1
  title: Что даёт переход?
  packs:
  - p3
  - p5
  not_before: 45
- id: q2
  title: Что со мной сейчас?
  packs:
  - p6
  not_before: 60
- id: q3
  title: Как набирали программу?
  packs:
  - p8
  not_before: 80
flights:
- name: Звено 1
  characters:
  - id: f1c1
    callsign: Один-Один
    symbol: circle
    gender: f
    names:
      m: Тимофей Вяземский
      f: Тамара Вяземская
    memory:
    - id: m1
      type: name
      text: «{Один-Один:Тимофей|Тамара}». Имя звучит до щелчка записи. Потом кто-то произносит числа.
        Имя хочется удержать, пока его не заменили.
      not_before: null
    - id: m2
      type: memory
      text: 'Перед тобой рисунок: планета, у которой слишком много лун. Женщина складывает его бережнее,
        чем остальные бумаги. «Это {Пять-Один:сын рисовал|дочь рисовала} для фильма». Ты спрашиваешь,
        сколько лун на самом деле. Она улыбается: «Какая разница, если человек захотел посмотреть?» Потом
        вспоминается число: 4102. Пока непонятно, к чему оно относится. Рисунок — понятнее.'
      not_before: null
    - id: m3
      type: link
      text: 'Женщину зовут Вера. Она показывает обратную сторону рисунка: девятое апреля, 0904. Говорит,
        детям так понятнее, что мир большой. Ты запоминаешь лишнюю луну и складку через планету. Если
        встретится тот, кто рисовал, можно спросить, почему нельзя было оставить одну.'
      not_before: 40
    - id: m4
      type: body
      text: 'Давление слева. Ты ищешь плечевой ремень и не находишь. Там не пусто: вокруг тебя поверхность,
        и вся она чувствует, откуда идёт свет. «Солнце вздохнуло», — думаешь ты. Это может быть образ
        из симулятора. Но образ слишком знакомый, словно однажды ты уже подбирал к нему слова.'
      not_before: 55
    - id: m5
      type: death
      text: 'Последнее дыхание прежнего тела. Ты знаешь, что оно последнее, и всё равно ждёшь следующего.
        Вера говорит считать. После трёх счёт обрывается. Ты не помнишь ни случайного удара, ни внезапной
        боли: до этого были назначенное время и дорога в лабораторию. Почему — ещё отдельный вопрос.'
      not_before: 65
    - id: m6
      type: arrival
      text: 'Подпись твоя. Перед ней ты спрашиваешь: «Экспедиции? Не учебные, настоящие?» Вера отвечает:
        «То, чего никто не видел». Ты знаешь, что прежнее тело не вернут. Ты выбираешь перейти. Ни оружия,
        ни права отдавать тебе любой приказ в этом согласии нет. Решение было твоим. Его дальнейший смысл
        определял кто-то ещё.'
      not_before: 80
    dossier:
      life: 51 год, {Один-Один:пилот-испытатель|пилот-испытательница}. До перехода знакомится с руководителем
        лаборатории. В материалах встречается рисунок планеты с лишними лунами. Число протокола — 4102.
      death: Прекращение жизнедеятельности прежнего тела при плановом переходе семь лет назад. Серия А.
      arrival: Личное добровольное согласие на необратимый переход ради экспедиций. Разрешения на боевое
        применение нет. Текущий контур переучивания начинается с фрагментарной памятью, без доступа к
        прежним навыкам управления.
  - id: f1c2
    callsign: Семь-Три
    symbol: square
    gender: m
    names:
      m: Илья Смолин
      f: Инна Смолина
    memory:
    - id: m1
      type: name
      text: «{Семь-Три:Илья|Инна}». Кто-то зовёт тебя из другого конца коридора. Ещё чуть-чуть — и вспомнится,
        зачем. Пока только имя.
      not_before: null
    - id: m2
      type: memory
      text: 'На рукаве белая полоска мела. За стеклом трамвая дождь. Ты повторяешь про себя: свет от звезды
        идёт так долго, что иногда звезды уже нет, а свет ещё приходит. Из кабины голос: «Четырнадцатый,
        седьмой борт, ответьте». Четырнадцать — ноль семь. 1407. Ты прислушиваешься: в этом голосе есть
        что-то, что хочется услышать ещё.'
      not_before: null
    - id: m3
      type: link
      text: 'Дверь кабины приоткрыта. Водитель жмёт кнопку, но слышен только треск. Голос в динамике не
        меняется: «Я на линии. Не выключайтесь». Ты наклоняешься к двери, чтобы сказать, что слышишь.
        Не помнишь, успеваешь ли. Если голос найдётся, можно спросить, был ли ответ.'
      not_before: 40
    - id: m4
      type: body
      text: Хочется показать рукой, как свет идёт от звезды. Вместо руки отзывается длинная поверхность
        слева. Она знает, откуда приходит тепло. Ты не видишь её, но расстояние до края понятно точнее,
        чем раньше было понятно положение пальцев. Ошибка отрисовки могла бы быть пустотой. Здесь что-то
        есть.
      not_before: 55
    - id: m5
      type: death
      text: 'Сверху падает пыль. Трамвай дёргается, и поручень становится невесомым. Человек рядом хватает
        тебя за рукав. В динамике: «Я на линии». Ты хочешь ответить сразу двоим: тому, кто держит рукав,
        и тому, кто зовёт вагон. Пол уходит. После этого в памяти нет ни остановки, ни больницы.'
      not_before: 65
    - id: m6
      type: arrival
      text: 'Это не воспоминание глазами. Тебе возвращается смысл строк из собственного дела: «Невостребованное
        тело. Срок 72 часа. Передача по договору». Не твоё решение. Не объяснение того, почему никто не
        пришёл. Только срок, за который другим разрешили решить за тебя. Ученики могли всё ещё ждать урока.'
      not_before: 80
    dossier:
      life: '34 года, {Семь-Три:учитель физики|учительница физики}. На одежде часто оставался мел. На
        занятиях объясняет: свет может пережить звезду. В ежедневном маршруте — трамвай 14, борт 07.'
      death: Гибель при обрушении эстакады на Заводской. В вагоне трамвая, вне кабины. Последний вызов
        диспетчера записан в сводке 1407.
      arrival: Тело не востребовано в течение 72 часов. Передача программе по договору с городским моргом.
        Личного согласия на переход нет. Причина отсутствия родственников в срок не установлена. Ведомость
        передачи — 1408, связана из сводки 1407.
  - id: f1c3
    callsign: Два-Два
    symbol: triangle
    gender: f
    names:
      m: Марк Лесных
      f: Марина Лесных
    memory:
    - id: m1
      type: name
      text: «{Два-Два:Марк|Марина}». Имя произносят тихо, чтобы не разбудить человека у окна. Ты сразу
        поворачиваешься на голос.
      not_before: null
    - id: m2
      type: memory
      text: 'Тёплая рука в твоей. На двери 312. Ноль три двенадцать, 0312. За окном ещё темно. Человек
        у окна говорит строку по-немецки и смеётся: «По-русски получается слишком прямо». Ты просишь всё-таки
        перевести. Перевода не помнишь. Руку помнишь.'
      not_before: null
    - id: m3
      type: link
      text: 'В палате шумит кислород. Человек говорит: «Вы всегда спрашиваете, не больно ли. А если я
        хочу, чтобы вы просто посидели?» Ты садишься. Потом приходится уйти на звонок из соседней палаты.
        «Вернусь», — говоришь ты. Не помнишь возвращения.'
      not_before: 40
    - id: m4
      type: body
      text: 'Ты помнишь, как согреть чужие пальцы между ладонями. Сейчас от попытки согреть отзывается
        поверхность за спиной: она раскрывается и отдаёт тепло. Точного движения пальцев нет. Есть точное
        знание, как сделать теплее — и как остудить. Пока непонятно, можно ли этим кому-нибудь помочь.'
      not_before: 55
    - id: m5
      type: death
      text: 'У раковины внезапно становится очень светло. Боль в голове короткая, будто кто-то щёлкнул
        выключателем. Ты успеваешь подумать: человек в 312 будет ждать. Пол касается щеки. Потом больше
        нет ни смены, ни возвращения. Обещание осталось у человека, который не знает, почему тебя больше
        нет рядом.'
      not_before: 65
    - id: m6
      type: arrival
      text: 'Ты помнишь датчики на висках после смены и форму: тест интерфейса связи с пациентом, можно
        остановить в любой момент. Подпись твоя. Из дела 0312 становится известно, что после твоей смерти
        ей придали другой смысл — перенос мозга. Разрешения на отказ от тела в твоей форме не было; право
        прекратить тест, наоборот, было. В деле написано: «Продолжение тестовой программы». Что именно
        они продолжили?'
      not_before: 80
    dossier:
      life: 27 лет, {Два-Два:медбрат|медсестра} хосписа «Тихая гавань». Задерживается у одиноких пациентов
        после обхода. В палате 312 слушает немецкие стихи, не зная языка.
      death: Внезапная смерть от аневризмы во время ночной смены. После ухода из палаты 312. Сообщение
        пациентам передано следующей смене, содержание сообщения в деле отсутствует.
      arrival: Ограниченное согласие сотрудника хосписа на тест нейроинтерфейса использовано как разрешение
        посмертного перехода. В исходной форме разрешены датчики и прерываемый сеанс, не перенос мозга.
        Несоответствие отмечено, исправление не внесено. См. 0312.
  - id: f1c4
    callsign: Девять-Один
    symbol: star
    gender: m
    names:
      m: Савва Гордеев
      f: Соня Гордеева
    memory:
    - id: m1
      type: name
      text: '«{Девять-Один:Савва|Соня}». В имени слышен смешок: опять слишком близко к микрофону. Кто
        смеётся, пока не вспомнить.'
      not_before: null
    - id: m2
      type: memory
      text: 'Канифоль пахнет сладко. Палец обожжён, но паять хочется самому. Кто-то рядом говорит: «Не
        дуй. Подожди, пока схватится». На бумажке частота: 145,50. Ты проговариваешь первые четыре цифры:
        1455. Воскресенье. Девять вечера. «Приём». На том конце обычно отвечают.'
      not_before: null
    - id: m3
      type: link
      text: 'Антенна наконец держится. Рядом человек со следами монтажного пояса на куртке. «Твой отец
        и на работе так: сначала дождётся ответа, потом отпустит кнопку». Ты спрашиваешь, что он строит.
        «Чтобы можно было услышать тех, кто далеко». Имени человека не помнишь. Его привычку ждать, пока
        ты закончишь паять, — да.'
      not_before: 40
    - id: m4
      type: body
      text: Раньше эфир был шумом в наушниках. Сейчас он проходит по всей поверхности вокруг тебя. Можно
        различить паузу до сигнала — место, в котором кто-то сейчас заговорит. Хочется нажать передачу.
        Пальца на кнопке нет, но само желание нажать отзывается знакомым щелчком.
      not_before: 55
    - id: m5
      type: death
      text: 'Мокрый визор. Фара встречного отражается сразу в нескольких лужах. Руль вдруг не возвращается.
        Последняя мысль не про дорогу: воскресенье, надо успеть к девяти. Удар. Нет воспоминания, в котором
        ты снимаешь шлем.'
      not_before: 65
    - id: m6
      type: arrival
      text: 'К воспоминанию возвращаются строки дела. В первые два часа врач отметил: «Обычная реанимация
        без результата. Применить сохранение нейроткани». Другой строкой: «Семью не дождались». Ты помнишь
        отца и знаешь: он мог бы приехать. Твоего согласия нет. Тебя хотели сохранить — и решили за тебя,
        чем будет продолжение. В архиве 1455 есть ответ, которого в твоей памяти нет.'
      not_before: 80
    dossier:
      life: 19 лет, {Девять-Один:студент, радиолюбитель|студентка, радиолюбительница}. Позывные и частоты
        записывает на обрывках бумаги. По воскресеньям в 21:00 выходит на 145,50. Родственник — инженер
        связи Л. Гордеев.
      death: Мотоциклетная авария на мокрой дороге, обычная реанимация без результата. Прежнее тело утрачено;
        сознание не вернулось до переноса.
      arrival: Врач выбрал протокол сохранения мозга после безуспешной обычной реанимации, не дождавшись
        семьи. Отец прибыл через шесть часов; личного согласия нет. Обращение к отделу комплектования
        — в записи 1456.
  - id: f1c5
    callsign: Четыре-Ноль
    symbol: cross
    gender: m
    names:
      m: Ефим Брагин
      f: Евгения Брагина
    memory:
    - id: m1
      type: name
      text: «{Четыре-Ноль:Ефим|Евгения} Брагин{Четыре-Ноль:|а}». Фамилия почему-то звучит яснее имени,
        как в журнале на обложке.
      not_before: null
    - id: m2
      type: memory
      text: 'Ветер трогает стекло, будто проверяет раму. Ты диктуешь: «Станция 2263. Давление семьсот
        сорок восемь. Ветер северный». После каждой сводки оставляешь паузу для ответа. Иногда отвечают,
        иногда только шум. Ты всё равно выдерживаешь паузу до конца.'
      not_before: null
    - id: m3
      type: link
      text: 'За месяцы узнаёшь голоса принимающих. Одному хочется сказать, что сегодня прилетела птица.
        Но он торопится: «Показания приняты». Ты не говоришь. Сводка доставлена, а птица остаётся только
        тебе. Сейчас вокруг снова голоса. Ни одного из них ты прежде не знаешь.'
      not_before: 40
    - id: m4
      type: body
      text: Ты пытаешься приоткрыть форточку, чтобы почувствовать ветер лицом. Вместо лица отзывается
        край вокруг тебя. За ним нет воздуха, но давление всё равно есть — от далёкого тела, которое не
        видно. Оно меняется медленно. Ты умеешь ждать таких изменений.
      not_before: 55
    - id: m5
      type: death
      text: Следующая сводка через три часа. Боль под грудиной заставляет сесть на пол. Передатчик на
        столе; до него остаётся совсем немного. Сначала ты считаешь вдохи, потом думаешь, заметят ли пропущенный
        срок. Воспоминания о следующей сводке нет.
      not_before: 65
    - id: m6
      type: arrival
      text: В деле одна фамилия и две жизни. {Четыре-Ноль:Евгений|Елена} Брагин{Четыре-Ноль:|а}, пилот,
        добровольное согласие; отказ за день до операции. И ты — другое имя, другой возраст, другая смерть.
        Система совместила инициалы. Когда ошибку заметили, график решили не сдвигать. Твоего согласия
        никто не искал.
      not_before: 80
    dossier:
      life: 62 года, {Четыре-Ноль:смотритель|смотрительница} островной метеостанции 2263. Тридцать лет
        ведёт наблюдения. После каждой сводки ждёт ответа, даже если условия связи плохие.
      death: Инфаркт на метеостанции. Тело найдено через шесть дней. Последняя запись в журнале — сводка
        погоды, следующая графа осталась пустой.
      arrival: Фамилия и инициал совпали с данными добровольца, отказавшегося от перехода. Согласие перенесено
        по совпадению. После выявления ошибки принято решение не сдвигать график. См. 2263.
