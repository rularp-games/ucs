archive:
- code: '6060'
  title: Основание
  kind: История
  not_before: 25
  queue: 1
  text: |-
    Справка. Институт дальних экспедиций. Лаборатория нейроинтерфейсов основана пятнадцать лет назад. Руководитель — В. Остроумова.

    Задача лаборатории: подготовка экипажей для маршрутов, на которых человек в привычной форме не выживает. Девиз: «Увидеть то, чего не видел никто».

    Связь с кораблями обеспечивает сеть ретрансляторов (см. 7203).
- code: '3108'
  title: Транспорт «Кедр»
  kind: История
  not_before: 35
  queue: 2
  text: |-
    Из сводки потерь войны за пояс. Транспорт «Кедр», бортовой 3108. Атакован беспилотным перехватчиком у края пояса. Пожар в машинном отсеке.

    Командир транспорта Р. {Три-Три:Ахмеров|Ахмерова}. Бортмеханик С. Ковальчук {Ноль-Семь:вывел|вывела} из горящего отсека четверых, {Ноль-Семь:получил|получила} ожоги. Экипаж спасён полностью, транспорт потерян.

    Ковальчук к награде {Ноль-Семь:представлен не был|представлена не была}: документы сгорели вместе с отсеком. Через год подписан Договор о пределах.
- code: '7203'
  title: Сеть «Ожерелье»
  kind: История
  not_before: 45
  queue: 3
  text: |-
    Техническая справка. Сеть «Ожерелье»: тридцать шесть ретрансляторов, главный инженер Л. Гордеев.

    Покрытие неполное. При прохождении корабля за плотными объектами возникают окна без связи длительностью до шести минут. Работа корабля в окне не регламентирована.

    Монтаж участка 7200–7210: П. {Восемь-Три:Ланской|Ланская}.

    Примечание инженера: «Окна не устранять. Обоснование в журнале, 7204».
- code: '0417'
  title: Исследование памяти
  kind: История
  not_before: 45
  queue: null
  text: |-
    Лаборатория Н. Сабуровой. Исследование сохранности памяти у взрослых добровольцев.

    {Один-Четыре:Участник|Участница} № 0417: Л. Мороз, 47 лет на момент включения, библиотекарь. Жалоба: страх забыть.

    Методика: пошаговое восстановление навыка через повторение, без объяснения участнику цели упражнения. Навык, освоенный полностью, участник выполняет без внимания.

    {Один-Четыре:Участник подписал|Участница подписала} согласие на дальнейшее использование данных исследования. Срок согласия не указан.
- code: '2207'
  title: Они видят
  kind: Диалог
  not_before: 55
  queue: 4
  text: |-
    Расшифровка разговора. В. Остроумова, Н. Сабурова.

    — Ты читала отчёт {Один-Один:Вяземского|Вяземской}?
    — Читала. Это не может быть правдой.
    — Обсерватория подтвердила через сорок одну минуту.
    — Значит, совпадение.
    — {Один-Один:Он сказал|Она сказала}: «Солнце вздохнуло». Нина, ни один человек этого не чувствовал. Ни один прибор.
    — Мы не знаем, что именно {Один-Один:он|она} чувствует.
    — Не знаем. Поэтому мы здесь. Это новый способ знать.
    — Или новый способ ошибаться. Кому ты это покажешь?
    — Всем. Это не наше.

    Приложения: 4102, 4511.
- code: '1407'
  title: Эстакада на Заводской
  kind: История
  not_before: 70
  queue: null
  text: |-
    Сводка происшествий. Обрушение эстакады на Заводской улице, 7:48.

    Трамвай маршрута 14, борт 07, упал вместе с пролётом. Диспетчерский пункт под пролётом разрушен. Диспетчер И. {Два-Семь:Сафин оставался|Сафина оставалась} на связи с вагоном до обрушения.

    Погибших двадцать три. Опознаны двадцать один. Невостребованных тел два.
- code: '1455'
  title: Частота 145,50
  kind: История
  not_before: 70
  queue: null
  text: |-
