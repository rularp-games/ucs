# Дерево прозрений: теория ложного вакуума.
#
# Здесь лежит ТОЛЬКО механика: структура узлов, метки, лампы, гости, финалы.
# Полные тексты карточек — в model-science-false-vacuum.md, он остаётся
# каноническим источником прозы. Поле summary — короткая выжимка для экрана
# мастера, а не замена карточке.
#
# Схема узла:
#   act, slot     — акт и позиция узла внутри акта (1..3)
#   title         — название карточки
#   minutes       — хронометраж узла (одинаков для всех карточек одного узла)
#   kind          — normal | dead_end | false_exit
#   lamp          — зажигается ли лампа (приход гостей)
#   summary       — выжимка «Что вы узнали»
#   master_note   — заметка мастеру
#   on_enter      — изменение меток при входе на карточку
#     remove: [...]            снять метки (молча, если их нет)
#     add:                     список правил выдачи, по порядку
#       - grant: [...]         выдать все, которых ещё нет
#         else:  [...]         если ни одна из grant не была новой — выдать это
#   guest         — что делает гость, пришедший на лампу
#     mode: take             унести предмет (marks_remove, closes_finals,
#                            disables_choice)
#     mode: copy             снять копию: метка остаётся, ставится set_flag
#     mode: take_first_mark   снять первую метку из mark_order; если у группы есть
#                            blocked_by_mark — вместо этого if_blocked
#   counter       — эффект хода Джона/Джейн «противодействовать»
#   variations    — блоки, зависящие от состояния группы
#     mode: first            зачитывается одна строка, первая подходящая
#     mode: all             зачитываются все подходящие, сверху вниз
#     условие строки: if_mark | if_visited | if_flag | if_no_marks | нет условия
#   slow_forbidden — в узле запрещён ход «замедлить»
#   false_flash   — лампа зажигается на провале
#   choices       — блок выбора; для узлов без выбора вместо него next
#     marks_add / set_flag  — последствия самого выбора, применяются до on_enter
#                             следующей карточки
#   next          — безусловный переход
#   final_choice  — true, если блок выбора — это выбор финала

meta:
  id: false-vacuum
  title: Теория ложного вакуума
  source: model-science-false-vacuum.md
  acts: 3
  nodes_per_run: 9

marks:
  ШКАЛА: У группы есть численная оценка времени жизни вакуума
  РАСЧЁТ: Группа доказала, что вопрос не решается наблюдением, только расчётом
  ГРАВИТАЦИЯ: В расчёт включены гравитационные эффекты
  МЕХАНИЗМ: Группа знает, как именно зарождается пузырь
  ТРИГГЕР: У группы есть идея искусственного запуска распада
  СОМНЕНИЕ: На руках несводимое противоречие

roles:
  Т: Теоретик
  Э: Экспериментатор
  З: Завлаб
  О: Осторожный

acts:
  1:
    title: Вопрос
    place: Кампус университета
  2:
    title: Порог
    place: Кампус университета
  3:
    title: Спусковой крючок
    place: Загородный дом

finals:
  F1:
    title: Публикация
    opened_by: [ШКАЛА, МЕХАНИЗМ]
    summary: >
      Работа уходит в печать целиком, включая условия запуска. На стол — рукопись
      с подписями всех членов группы, подписывают по одному, вслух называя себя.
  F2:
    title: Эксперимент
    opened_by: [ТРИГГЕР]
    summary: >
      Заявка на опыт: минимальная конфигурация, при которой затравка либо
      сработает, либо будет исключена. На стол — заявка с датой запуска.
  F3:
    title: Молчание
    opened_by: []
    summary: >
      Результат верен, публиковать его нельзя. Записи уничтожаются физически, при
      всех. Если уничтожать нечего — группа записывает на чистом листе то, что
      помнит наизусть, и жжёт этот лист.
  F4:
    title: Самоопровержение
    opened_by: [ГРАВИТАЦИЯ, СОМНЕНИЕ]
    summary: >
      Публикуется опровержение собственной работы. С меткой ГРАВИТАЦИЯ оно
      физическое и закрывает тему для всех; только с СОМНЕНИЕМ — формальное и
      закрывает тему для группы одной.

# Правило нижней границы: если группе доступен ровно один финал, она получает
# первую подходящую метку из этого списка. Метка не выдаётся, если финал,
# который она открывает, закрыт явным указанием карточки.
final_floor:
  - mark: СОМНЕНИЕ
    opens: F4
  - mark: ШКАЛА
    opens: F1
  - mark: ТРИГГЕР
    opens: F2

start: "1.1"

nodes:

  # ------------------------------------------------------------------ Акт 1

  "1.1":
    act: 1
    slot: 1
    minutes: 12
    title: Письмо из Санта-Барбары
    kind: normal
    lamp: false
    summary: >
      Конверт из Санта-Барбары: Коулман и Де Лучча о гравитационных эффектах при
      распаде вакуума, плюс «Судьба ложного вакуума» 1977 года. На полях чужим
      почерком: «Посмотрите, чем это кончается, если считать всерьёз». Мир стоит
      не на дне, а на уступе; шарик на уступе соскальзывает. Вероятность зависит
      от одного числа как экспонента.
    master_note: >
      Группа неявно принимает формулу, годную только для частного случая.
      Опровергается в 2.1.
    choices:
      - key: A
        text: >
          Считать самим, с нуля. Полгода работы. Зато ответ будет ваш, и
          проверять его будет некому.
        roles: [Т]
        development: внутренняя теория
        to: "1.2a"
      - key: B
        text: >
          «Мы живы — значит, обошлось». Написать это, поставить точку и вернуться
          к нормальным делам. Быстро, и звучит убедительно. Слишком убедительно.
        roles: [З]
        development: наблюдение
        to: "1.2b"
      - key: C
        text: >
          Спросить у больших теорий. Нужное число можно взять готовым у теории
          Великого объединения. Если детектор не подведёт, вы сэкономите год.
        roles: [Э]
        development: внешний источник
        to: "1.2c"
      - key: D
        text: >
          «Такое уже случалось». В прошлом феврале в Стэнфорде поймали частицу,
          которая рождается только при смене основания мира. Если она настоящая.
        roles: [Э, О]
        development: внешний источник
        to: "1.2d"

  "1.2a":
    act: 1
    slot: 2
    minutes: 12
    title: Баунс
    kind: normal
    lamp: false
    summary: >
      У соскальзывания есть математическое описание — баунс. Пузырёк должен
      родиться сразу достаточно большим: меньше критического размера схлопывается,
      больше — растёт неудержимо. Формула для критического размера короткая: в ней
      натяжение поверхности и выигрыш нового мира над старым.
    master_note: >
      Короткая формула выведена для случая, когда «выгоднее» — почти нисколько.
      Опровергается в 2.1.
    choices:
      - key: A
        text: >
          Взять короткую формулу и выдать число сегодня. Ответ будет к вечеру.
          Формула выведена для частного случая, и наш ли это случай — не проверял
          никто.
        roles: [З]
        development: допущение
        to: "1.3a"
        marks_add: [СОМНЕНИЕ]
        marks_reason: взяли формулу, не проверив область применимости
      - key: B
        text: >
          Считать честно, численно. Три ночи машинного времени, которое придётся
          выпрашивать у вычислительного центра. Зато никаких «предположим».
        roles: [Т]
        development: расчёт
        to: "1.3b"
      - key: C
        text: >
          Вспомнить про тяжесть. Гравитацию в этом расчёте не учитывал никто, а
          Коулман с Де Луччей пишут, что она способна поменять ответ на
          противоположный.
        roles: [О]
        development: внутренняя теория
        to: "1.3c"

  "1.2b":
    act: 1
    slot: 2
    minutes: 12
    title: Мы всё ещё здесь
    kind: normal
    lamp: false
    summary: >
      Мир стоит четырнадцать миллиардов лет и не соскользнул. Довод честный и
      работает ровно в одну сторону: он говорит, что до сих пор не соскользнуло, и
      ничего не говорит о том, сколько осталось. Задавать такие вопросы может
      только тот, кто уцелел. Мёртвые не считают.
    master_note: >
      Если группа выберет A, она унесёт в акт 2 убеждение, что безопасность
      доказана. Разбирается в 2.1.
    choices:
      - key: A
        text: >
          Этого достаточно. Четырнадцать миллиардов лет — весомый аргумент, что бы
          там ни говорила логика. Оформить и закрыть тему.
        roles: [З]
        development: допущение
        to: "1.3a"
        marks_add: [СОМНЕНИЕ]
      - key: B
        text: >
          Довести мысль до конца. Если наша выживаемость не доказывает ничего —
          надо понять, что вообще способно что-то доказать.
        roles: [Т]
        development: внутренняя теория
        to: "1.3b"
      - key: C
        text: >
          Спросить, увидим ли мы это заранее. Если где-то далеко уже началось —
          придёт ли предупреждение и сколько у нас будет времени.
        roles: [Э, О]
        development: наблюдение
        to: "1.3c"

  "1.2c":
    act: 1
    slot: 2
    minutes: 12
    title: Шкала Великого объединения
    kind: normal
    lamp: false
    summary: >
      Чтобы считать дальше, нужна глубина второго дна. Своего ответа нет, чужой
      есть: теории Великого объединения дают её, и у них есть проверяемое
      следствие — протон нестабилен. IMB в Огайо и Kamiokande в Японии ждут
      распада прямо сейчас, первые результаты вот-вот будут.
    master_note: >
      К 1983–1984 годам оба детектора не увидят ни одного распада. Минимальная
      модель Джорджи и Глэшоу будет мертва. Раскрывается в 2.2b.
    choices:
      - key: A
        text: >
          Взять чужое число и работать дальше. В эту теорию верят все, кого вы
          уважаете. Верить всем — экономия года жизни.
        roles: [З]
        development: допущение
        to: "1.3a"
      - key: B
        text: >
          Не ждать публикации. У вас есть знакомые на детекторе. Попросить сырые
          данные до печати — неприлично, зато сразу.
        roles: [Э, З]
        development: внешний источник
        to: "1.3b"
      - key: C
        text: >
          Обойтись без чужих теорий. Искать глубину внутри собственной задачи.
          Дольше, зато опору из-под вас никто не выдернет.
        roles: [Т, О]
        development: внутренняя теория
        to: "1.3c"

  "1.2d":
    act: 1
    slot: 2
    minutes: 12
    title: День святого Валентина
    kind: dead_end
    lamp: false
    summary: >
      14 февраля 1982 года кольцо Бласа Кабреры в Стэнфорде зарегистрировало ровно
      один сигнал — точно той величины и формы, какие дал бы пролёт магнитного
      монополя. Событие не повторилось ни разу. Одно событие — это не данные: ни
      глубины, ни вероятности, ни срока из него не извлечь.
    master_note: >
      Первый намёк на Мироздание, поданный изнутри науки, а не через гостя.
      Не подчёркивать. Оба варианта не дают ничего по существу теории:
      группа потратила узел.
    choices:
      - key: A
        text: >
          Собрать своё кольцо. Гелий, полгода ожидания, шанс поймать второй такой
          же сигнал. Если он придёт — самая громкая работа десятилетия.
        roles: [Э]
        development: эксперимент
        to: "1.3c"
        marks_add: [СОМНЕНИЕ]
        marks_reason: детектор не поймает ничего
      - key: B
        text: >
          Списать на сбой прибора. Один раз — это не данные. Вернуться к расчётам,
          пока не потеряли неделю.
        roles: [Т]
        development: расчёт
        to: "1.3c"

  "1.3a":
    act: 1
    slot: 3
    minutes: 14
    title: Число
    kind: normal
    lamp: true
    summary: >
      Есть первая оценка того, сколько простоит наш мир — и её погрешность.
      Сдвиньте входные данные на десять процентов, и ответ уедет на двадцать
      порядков. Диапазон тянется от «неизмеримо дольше, чем существует Вселенная»
      до «примерно столько, сколько она уже простояла». Число написано на доске.
      Стирать его никто не хочет.
    master_note: Число будет аннулировано в 2.1.
    on_enter:
      add:
        - grant: [ШКАЛА]
    guest:
      item: Число на доске
      mode: copy
      note: >
        Гость переписывает число к себе — в блокнот, в тетрадь, на манжету.
        С доски оно не исчезает, метка остаётся.
      set_flag: number_left_room
      master_note: >
        Аннулирование числа — центральная сцена узла 2.1. Если ШКАЛА пропадает в
        первом акте, стирать во втором нечего. Разоблачение должно случаться один
        раз и в отведённом месте.
    counter:
      marks_add: [РАСЧЁТ]
      note: Число из комнаты не уходит.
    next: "2.1"

  "1.3b":
    act: 1
    slot: 3
    minutes: 14
    title: Односторонняя граница
    kind: normal
    lamp: true
    summary: >
      Наблюдение способно установить ровно одно: пока не соскользнуло. Сколько
      осталось — не покажет ни один прибор, никогда: наблюдателя, пережившего это
      событие, не бывает. Остаётся расчёт, которому не нужно ни оборудования, ни
      разрешения. Кто-то произносит вслух: опасность не в приборе, опасность в
      том, что мы просто думаем.
    on_enter:
      add:
        - grant: [РАСЧЁТ]
    guest:
      item: Лист с формулировкой про одностороннюю границу
      mode: take
      marks_remove: [РАСЧЁТ]
    counter:
      marks_add: [ГРАВИТАЦИЯ]
    next: "2.1"

  "1.3c":
    act: 1
    slot: 3
    minutes: 14
    title: Стенка
    kind: normal
    lamp: true
    summary: >
      Граница пузыря разгоняется почти до скорости света за время, за которое сама
      проходит собственную толщину. Граница и свет от неё идут вместе —
      предупреждения не будет. Второе, из Коулмана и Де Луччи: тяжесть меняет
      картину качественно. При одних числах она запирает мир на уступе намертво,
      при других подталкивает. Какая именно — зависит от величин, которых у вас нет.
    on_enter:
      add:
        - grant: [ГРАВИТАЦИЯ]
    guest:
      item: Расчёт скорости стенки
      mode: take
      marks_remove: [ГРАВИТАЦИЯ]
    counter:
      marks_add: [РАСЧЁТ]
    next: "2.1"

  # ------------------------------------------------------------------ Акт 2

  "2.1":
    act: 2
    slot: 1
    minutes: 15
    title: Ошибка на двадцать порядков
    kind: normal
    lamp: false
    slow_forbidden: true
    slow_forbidden_reason: >
      Карточка снимает метку. Иначе группа теряет результат дважды за один узел и
      остаётся в акте почти без продвижения.
    summary: >
      Короткая формула, на которой держится вся арифметика, выведена для случая,
      когда новый мир выгоднее старого почти нисколько. Для любой заметной разницы
      она не работает — не «работает неточно», а не работает. Ответ уезжает на
      десятки порядков, и неизвестно даже в какую сторону. Считать придётся
      численно; короткого пути для общего случая не существует.
    on_enter:
      remove: [ШКАЛА]
    variations:
      how:
        mode: first
        title: Как вы это узнали
        rows:
          - if_mark: СОМНЕНИЕ
            text: >
              Никто вам этого не сообщал. Вы наткнулись на это сами, в четверг,
              около двух ночи, разбирая совершенно другой вопрос.
            master_note: не комментировать
          - text: Приходит отзыв рецензента. Короткий и вежливый.
      meaning:
        mode: all
        title: Что это значит для вас
        rows:
          - if_mark: ШКАЛА
            text: Число на доске аннулировано, метка снимается.
          - if_mark: РАСЧЁТ
            text: Вы уже знали, что всё держится на вычислении. Удар мягче.
          - if_mark: ГРАВИТАЦИЯ
            text: >
              Поправка на тяжесть того же размера, что и ошибка. Две
              неопределённости накладываются.
          - if_no_marks: true
            text: >
              Терять нечего, за неделю вы не нажили ничего, что могло бы рухнуть.
              Это читается как чужая новость, а не как удар. Единственное, что вы
              узнали: работа, которую вы ещё не начали, будет длиннее, чем казалось.
    choices:
      - key: A
        text: >
          Пересчитать заново, честно. Три ночи машинного времени и никаких
          коротких путей. Скучно, долго, надёжно.
        roles: [Т]
        development: расчёт
        to: "2.2a"
      - key: B
        text: >
          Взять глубину у эксперимента. Если новая физика там, где думают, протон
          обязан распадаться — а детекторы работают прямо сейчас.
        roles: [Э, З]
        development: внешний источник
        to: "2.2b"
      - key: C
        text: >
          Сменить вопрос. Хватит спрашивать «когда». Спросить «как»: что вообще
          способно это начать.
        roles: [Э]
        development: внутренняя теория
        to: "2.2c"
      - key: D
        text: >
          Проверить, не спасает ли нас тяжесть. Есть шанс, что гравитация закрывает
          вопрос совсем — и тогда вся эта неделя была зря, и слава богу.
        roles: [О]
        development: внутренняя теория
        to: "2.2d"

  "2.2a":
    act: 2
    slot: 2
    minutes: 13
    title: Численный счёт
