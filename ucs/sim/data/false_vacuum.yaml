        to: "2.3c"

  "2.2c":
    act: 2
    slot: 2
    minutes: 13
    title: Три способа
    kind: normal
    lamp: true
    summary: >
      Соскользнуть можно тремя способами. Само собой — квантово, всегда и повсюду,
      настолько редко, что счёт идёт на числа, которые не с чем сравнить;
      управлять нельзя. От жары — в молодой Вселенной так и было, сегодня таких
      температур нет нигде. От толчка — сильное возмущение в малой области
      работает как затравка: перегретая вода стоит сколько угодно, брошенная
      пылинка вскипает её мгновенно. Пылинке не нужно быть горячей, ей достаточно
      быть. Третий способ — единственный, к которому применимо слово «устроить».
    master_note: >
      В 3.1 группа обнаружит, что для третьего способа важна не общая энергия
      толчка, а её плотность в малой области. Авторский домысел: в реальной
      литературе механизм затравки обсуждается, количественного порога нет.
    on_enter:
      add:
        - grant: [МЕХАНИЗМ]
    guest:
      item: Лист «три способа»
      mode: take
      marks_remove: [МЕХАНИЗМ]
