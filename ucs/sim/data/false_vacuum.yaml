          else: [РАСЧЁТ]
    guest:
      item: Лист с расчётом затравки
      mode: take
      marks_remove: [ТРИГГЕР]
    counter:
      marks_add: [ГРАВИТАЦИЯ]
    next: "3.1"

  "2.3c":
    act: 2
    slot: 3
    minutes: 12
    title: Ускоритель
    kind: normal
    lamp: true
    summary: >
      Вопрос уже задан публично, и не вами. Тёрнер и Вильчек, «Nature», 1982:
      «Метастабилен ли наш вакуум?» — может ли столкновение в ускорителе запустить
      соскальзывание. Через год там же ответ: Хат и Рис. Космические лучи
      бомбардируют вещество миллиарды лет с энергиями, которых не даст ни один
      ускоритель; природа поставила опыт неисчислимое число раз, мир цел — значит,
      ускорители безопасны. Вопрос закрыт. Все, кого вы уважаете, считают его
      закрытым.
