  # ------------------------------------------------------------------ Акт 3

  "3.1":
    act: 3
    slot: 1
    minutes: 14
    title: Загородный дом
    kind: normal
    lamp: true
    summary: >
      Вы разложили на столе всё, что накопилось за неделю, и впервые посмотрели на
      это целиком. Складывается в три пункта. Первое: сколько мир простоит сам по
      себе — не вычисляется, экспонента съедает любую доступную точность. Второе:
      чем его подтолкнуть — вычисляется, это местная задача без экспоненты.
      Третье следует из первых двух и никому не нравится: из всех вопросов о
      ложном вакууме наука способна ответить ровно на один — на тот, который
      спрашивает, как его сломать.
    variations:
      meaning:
        mode: all
        title: Что это значит для вас
        rows:
          - if_visited: "2.2d"
            text: >
              Успокоительный результат разваливается. Область чисел, где тяжесть
              запирает мир, не пересекается с той, что даёт остальной ваш расчёт.
              Радость была преждевременной.
          - if_flag: letter_sent
            text: И письмо уже ушло.
          - if_mark: ТРИГГЕР
            text: >
              У вас на руках не рассуждение, а схема. Условия выписаны явно, на
              одном листе.
          - if_mark: СОМНЕНИЕ
            text: >
              Противоречие, которое вы таскаете с собой, при желании можно
              предъявить как опровержение всей работы. Никто не станет проверять.
          - if_no_marks: true
            text: >
              Вы дошли до сути позже других и налегке. Это не хуже: вам нечего
              защищать.
    guest:
      item: Сводка из трёх пунктов
      mode: take_first_mark
      mark_order: [ТРИГГЕР, МЕХАНИЗМ, ГРАВИТАЦИЯ, ШКАЛА, СОМНЕНИЕ]
      note: >
        Группа теряет одну метку по порядку, выбирать она не может — забирается
        первая из имеющихся.
      blocked_by_mark: РАСЧЁТ
      blocked_note: >
        Три пункта известны всем четверым наизусть; забрать бумагу можно,
        содержание — нет. Сама метка РАСЧЁТ при этом не тратится и не изымается.
      if_blocked: take_person
      if_blocked_note: >
        Гость уносит человека: вызов к телефону, срочный разговор на крыльце,
        подвезти до города. Игрок называется гостем, не группой. Персонаж выбывает
        на весь следующий узел — 3.2x группа проходит втроём. Если гость увёл
        Джона/Джейн, ход в узле 3.2x потратить нельзя.
      master_note: >
        Это то, ради чего щит вообще нужен: он не отменяет угрозу, а меняет её с
        бумажной на человеческую. Без этого правила гость приходит на лампу и
        стоит без дела.
    counter:
      marks_add: [ШКАЛА]
      note: >
        Защищая бумаги, кто-то заново прогоняет старую оценку, и на этот раз она
        сходится.
      # Ход тратится на защиту человека, а не бумаги: сводку гость и так не унёс.
    choices:
      - key: A
        text: >
          Довести до числа. Какая именно плотность энергии нужна, в какой области,
          на какое время. Три величины, один лист бумаги.
        roles: [Т, Э]
        development: расчёт
        to: "3.2a"
      - key: B
        text: >
          Проверить, почему все спокойны. Довод про космические лучи слишком
          удобен. Тридцать лет им закрывают этот вопрос, и никто не проверял его
          на прочность.
        roles: [Т, О]
        development: внутренняя теория
        to: "3.2b"
      - key: C
        text: >
          Узнать, кто ещё этим занят. Если вы не одни, ваше решение значит меньше,
          чем кажется.
        roles: [З]
        development: внешний источник
        to: "3.2c"
      - key: D
        text: >
          Пройти всё заново и найти ошибку. Где-то она должна быть. Не может не
          быть.
        roles: [Э, О]
        development: расчёт
        to: "3.2d"

  "3.2a":
    act: 3
    slot: 2
    minutes: 12
    title: Порог
    kind: normal
    lamp: true
    summary: >
      Число есть. Нужна определённая плотность энергии, в области определённого
      размера, удерживаемая определённое время — три величины на листе в клетку,
      обведённые рамкой. Ни один существующий ускоритель этого не даёт, разрыв
      большой. Дальше начинается неприятное: разрыв большой, но конечный, и
      выражен он в тех же величинах, которыми оперируют проектировщики машин. Это
      не «невозможно». Это «не сейчас». Кто-то считает в уме, за сколько лет
      техника проходит такой разрыв. Вслух не говорит.
    on_enter:
      add:
        - grant: [ТРИГГЕР]
          else: [ШКАЛА]
          else_reason: порог — это три числа
    guest:
      item: Лист в клетку с порогом
      mode: take
      marks_remove: [ТРИГГЕР]
      closes_finals: [F2]
    counter:
      marks_add: [МЕХАНИЗМ]
    final_choice: true
    choices:
      - key: F1
        text: Напечатать всё, включая этот лист. Пусть знают все, а не один.
        roles: [З]
      - key: F2
        text: Подать заявку на опыт. Пока считают чужие, лучше проверить самим.
        roles: [Э]
      - key: F3
        text: Сжечь. Есть вопросы, правильный ответ на которые — не отвечать.
        roles: [О]

  "3.2b":
    act: 3
    slot: 2
    minutes: 12
    title: Космические лучи врут
    kind: normal
    lamp: true
    summary: >
      Довод Хата и Риса неполон, и дыра в нём элементарная. Космический луч бьёт в
      неподвижное ядро, и после удара вся получившаяся каша продолжает лететь
      вперёд почти со скоростью света — прочь от Земли. Что бы там ни возникло,
      оно возникло на лету и мгновенно оказалось где-то ещё. Во встречных пучках
      всё иначе: то, что получилось, остаётся на месте. Если для рождения пузыря
      нужно время — а по вашему же расчёту нужно, — то космические лучи ставили
      другой опыт. Тридцать лет всех успокаивала теорема, которая не о том.
    on_enter:
      add:
        - grant: [ТРИГГЕР, СОМНЕНИЕ]
          else: [МЕХАНИЗМ]
    guest:
      item: Черновик контрдовода
      mode: take
      marks_remove: [ТРИГГЕР]
    counter:
      marks_add: [МЕХАНИЗМ]
    final_choice: true
    choices:
      - key: F2
        text: >
          Подать заявку на опыт. Раз довод безопасности сломан, ответ надо
          получить самим и первыми.
        roles: [Э]
      - key: F3
        text: >
          Сжечь. Вы только что сняли единственный предохранитель, который был у
          всех.
        roles: [О]
      - key: F4
        text: >
          Опровергнуть самих себя. Написать, что вывод опирается на непроверяемое
          допущение, и закрыть тему для всех.
        roles: [З, О]

  "3.2c":
    act: 3
    slot: 2
    minutes: 12
    title: Кто ещё это считает
    kind: normal
    lamp: true
    summary: >
      Вы обзвонили тех, кому доверяете, и задали осторожные вопросы. Как минимум
      две группы идут той же дорогой: одна в Европе, при ускорительном центре, с
      машинным временем, которого нет у вас; вторая на другом побережье и, судя по
      вопросам, отстаёт от вас на месяц. Остановиться в одиночку недостаточно:
      ваше молчание не отменит их публикации. Единственное, на что влияет ваш
      выбор, — будет ли на этой работе ваше имя. Второй вывод хуже первого: если
      мешают именно тем, кто подошёл близко, то мешают сейчас не только вам.
    variations:
      meaning:
        mode: all
        title: Дополнительно
        rows:
          - if_flag: number_left_room
            text: >
              Одна из двух групп отталкивается от числа, которое вы стёрли с доски
              полтора месяца назад. Вы никому его не сообщали.
    guest:
      item: Список фамилий и телефонов
      mode: take
      closes_finals: [F1]
      note: печатать уже некуда и незачем
    counter:
      marks_add: [ТРИГГЕР]
    final_choice: true
    choices:
      - key: F1
        text: >
          Напечатать первыми. Если это всё равно выйдет наружу — пусть выйдет
          правильно и с вашим именем.
        roles: [З]
      - key: F2
        text: >
          Подать заявку на опыт. Обогнать. Ответ должен быть у тех, кто понимает,
          что делает.
        roles: [Э, Т]
      - key: F3
        text: Сжечь. Пусть это будет на чужой совести.
        roles: [О]

  "3.2d":
    act: 3
    slot: 2
    minutes: 12
    title: Ошибка в третьем знаке
    kind: dead_end
    lamp: true
    false_flash: true
    summary: >
      Вы прошли всю цепочку с начала, шаг за шагом, вдвоём и независимо друг от
      друга. И нашли место: один переход в середине, где принято допущение,
      которое можно оспорить. Не ошибка — именно допущение. Если оно неверно,
      рушится всё; если верно, всё стоит. Проверить его нельзя ни расчётом, ни
      прибором, ни ссылкой на литературу — литературы по этому месту нет и не
      будет. Теперь у вас есть возможность честно закрыть тему. Вы просто никогда
      не узнаете, искали вы ошибку или искали повод.
    master_note: >
      Ложная вспышка: группа зажигает свет, найдя повод остановиться. Эта строка
      не разрешается ни в игре, ни в финале.
    on_enter:
      add:
        - grant: [СОМНЕНИЕ]
          else: [ГРАВИТАЦИЯ]
          else_reason: спорное допущение оказалось как раз про тяжесть
    guest:
      item: Страница с непроверяемым допущением
      mode: take
      marks_remove: [СОМНЕНИЕ]
      closes_finals: [F4]
    counter:
      marks_add: [МЕХАНИЗМ]
    final_choice: true
    choices:
      - key: F3
        text: Сжечь. Не публиковать ни работу, ни опровержение. Просто уйти.
        roles: [О]
      - key: F4
        text: >
          Опровергнуть самих себя. Оформить найденное как опровержение и закрыть
          тему для всех, включая две другие группы.
        roles: [З]
