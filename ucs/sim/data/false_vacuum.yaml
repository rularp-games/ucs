        roles: [Э, З]
        development: внешний источник
        to: "2.3c"

  "2.2d":
    act: 2
    slot: 2
    minutes: 13
    title: Гравитация спасает
    kind: false_exit
    lamp: true
    summary: >
      Коулман и Де Лучча правы: тяжесть действительно способна запереть мир на
      уступе. При определённых числах она делает край непреодолимым — не «редко», а
      нельзя. Вы подставляете свои числа. Условие выполняется. Наш мир устойчив,
      работа закончена, и закончена хорошим результатом. В комнате впервые за
      неделю смеются.
    master_note: >
      Не тупик: ветка выглядит успешной и даёт неверный ответ. Условие выполняется
      в узкой области чисел, и она не совпадает с той, которую даёт остальной
      расчёт группы. Расхождение вскроется в 3.1. При обратном знаке тяжесть,
