        development: внутренняя теория
        to: "2.3c"

  "2.3a":
    act: 2
    slot: 3
    minutes: 12
    title: Точность, которой нет
    kind: normal
    lamp: true
    summary: >
      Вы выяснили, сколько данных нужно, чтобы ответить на ваш вопрос. Столько не
      будет: требуемая точность превосходит возможности не только нынешних
      приборов, но и тех, которые сейчас проектируют. На вопрос «сколько нам
      осталось» ответа не будет ни при вашей жизни, ни при жизни ваших учеников.
      А вопрос «можно ли это запустить» — маленький и местный, ему не нужна
      космологическая точность. Из двух вопросов доступен именно опасный.
    on_enter:
      add:
        - grant: [РАСЧЁТ]
          else: [ШКАЛА]
    guest:
      item: Таблица требуемой точности
      mode: take
      marks_remove: [РАСЧЁТ]
    counter:
      marks_add: [МЕХАНИЗМ]
    next: "3.1"

  "2.3b":
    act: 2
    slot: 3
    minutes: 12
    title: Зародыш
    kind: normal
    lamp: true
    summary: >
      Расчёт затравки сошёлся. Когда мир соскальзывает сам, вероятность спрятана в
      экспоненте и ответ уходит за сорок порядков. Для затравки экспоненты нет —
      есть обычная зависимость от плотности толчка и размера области. Посчитать,
      сколько мир простоит сам, невозможно. Посчитать, чем его подтолкнуть, —
      можно, и ответ выходит не абсурдно большим. Кто-то замечает, что от «не
      абсурдно большого» до «достижимого» — один шаг рассуждения.
